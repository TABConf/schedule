<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABConf 8 Schedule · October 12-15, 2026</title>
<meta name="description" content="The full session schedule for TABConf 8, the final TABConf. October 12 to 15, 2026, Georgia Tech Exhibition Hall, Atlanta.">
<style>
:root{
  color-scheme: light dark;
  --bg:#faf8f5; --card:#fff; --ink:#161615; --muted:#6c6862;
  --line:#e6e1d9; --accent:#c2410c; --accent-soft:#fdf1e7;
  --allday:#0f766e; --allday-soft:#e6f4f1;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#14131a; --card:#1d1c24; --ink:#eceaf0; --muted:#9b97a6;
    --line:#2f2d3a; --accent:#fb923c; --accent-soft:#2a1d14;
    --allday:#5eead4; --allday-soft:#14302c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px}
a{color:inherit}

header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{padding-top:24px;padding-bottom:22px;display:flex;align-items:center;gap:22px}
.logo{flex:0 0 auto;width:132px;height:auto;display:block}
.titles{min-width:0}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}

.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 6px;position:sticky;top:0;
  background:var(--bg);padding:12px 0;z-index:20;border-bottom:1px solid var(--line)}
input[type=search]{flex:1;min-width:170px;padding:9px 12px;font:inherit;font-size:14px;border:1px solid var(--line);
  border-radius:7px;background:var(--card);color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:9px;overflow:hidden;background:var(--card);flex:0 0 auto}
.seg button{border:0;background:transparent;color:var(--accent);font:inherit;font-size:14px;font-weight:600;
  padding:9px 22px;cursor:pointer;letter-spacing:.01em;transition:background .12s,color .12s}
.seg button:hover{background:var(--accent-soft)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}

.day{margin:0 0 30px}
.dayhead{position:sticky;top:61px;background:var(--bg);padding:14px 0 8px;z-index:10;
  border-bottom:2px solid var(--ink);margin-bottom:2px}
.dayhead h2{margin:0;font-size:17px;letter-spacing:-.01em}
.dayhead .badge{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  color:var(--allday);background:var(--allday-soft);border:1px solid var(--allday);
  padding:2px 8px;border-radius:3px;vertical-align:3px;margin-left:9px}

/* ---------- details view ---------- */
.session{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.session:last-child{border-bottom:none}
.when{font-family:var(--mono);font-size:12.5px;line-height:1.45;padding-top:2px}
.when .s{font-weight:600}
.when .e,.when .d{color:var(--muted);font-size:11.5px;display:block}
.title{margin:0 0 5px;font-size:15.5px;font-weight:600;line-height:1.35}
.title a{text-decoration:none}
.title a:hover{color:var(--accent);text-decoration:underline}
.summary{margin:0;color:var(--muted);font-size:13.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:11px;border:1px solid transparent;
  font-weight:600;white-space:nowrap;line-height:1.6;vertical-align:1px}
.who{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.num{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* Speakers sit on their own line between the summary and the labels, so the
   person reads as part of the session rather than as one more tag. */
.speakers{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:9px}
.speaker{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-size:13px;font-weight:600;color:var(--ink)}
.speaker:hover{color:var(--accent)}
.speaker .avatar{width:24px;height:24px;border-radius:50%;display:block;
  background:var(--line);flex:none}

/* ---------- calendar view ---------- */
.grid{width:100%;border-collapse:collapse;font-size:13.5px}
.grid th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.grid tr:hover td{background:var(--accent-soft)}
.grid .c-time{font-family:var(--mono);font-size:12.5px;white-space:nowrap;width:150px}
.grid .c-loc{color:var(--muted);white-space:nowrap;width:110px}
.grid .c-who{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;width:150px}
.grid .c-title{font-weight:600}
.grid .c-title .tag{margin-left:7px}
.grid .c-title a{text-decoration:none}
.grid .c-title a:hover{color:var(--accent);text-decoration:underline}

/* Two room days. One column per room, so a reader can see what is on opposite
   a session rather than inferring it from a Location column. */
.gridwrap{overflow-x:auto}
.grid-rooms{table-layout:fixed;min-width:560px}
.grid-rooms .c-room{width:auto;vertical-align:top}
.grid-rooms thead .c-room{color:var(--accent);font-size:11px}
.grid-rooms .c-time{width:92px}
.cell{padding:2px 0 6px}
.cell + .cell{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.cell-title{font-weight:600;line-height:1.35}
.cell-title .tag{margin-left:7px}
.cell-title a{text-decoration:none}
.cell-title a:hover{color:var(--accent);text-decoration:underline}
.cell-who{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.cell-sp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);text-decoration:none}
.cell-sp:hover{color:var(--accent)}
.cell-sp img{width:18px;height:18px;border-radius:50%;display:block}
.cell-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}

/* Satellite events, one block per day */
.sats{margin-top:16px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 15px}
.sats-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:600;margin-bottom:8px}
.sat{display:flex;gap:14px;padding:5px 0}
.sat-when{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:78px}
.sat-body{font-weight:600}
.sat-body a{text-decoration:none}
.sat-body a:hover{color:var(--accent);text-decoration:underline}
.sat-place{font-weight:400;color:var(--muted)}
.sats-note{font-size:11.5px;color:var(--muted);margin-top:8px}
.grid-rooms td.c-room:empty::after{content:"";display:block}
.grid-rooms td.c-room{padding:0 4px;border-bottom:none}
.grid-rooms td.c-time{border-bottom:none;font-size:11.5px;color:var(--muted)}
.grid-rooms td.span{background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:6px 9px;vertical-align:top}
.grid-rooms tbody tr:hover td{background:inherit}
.grid-rooms tbody tr:hover td.span{background:var(--accent-soft)}

.note{background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:6px;padding:12px 15px;margin:14px 0 0;font-size:13.5px}
.empty{color:var(--muted);padding:48px 0;text-align:center}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

@media(max-width:640px){
  header .wrap{gap:14px}
  .logo{width:84px}
  h1{font-size:20px}
  .sub{font-size:13px}
  .session{grid-template-columns:1fr;gap:5px}
  .when{padding-top:0}
  .when .e,.when .d{display:inline;margin-right:9px}
  .dayhead{top:57px}
  .grid .c-who,.grid .c-loc{display:none}
  /* The room columns are the point of that view, so it scrolls sideways in its
     own container rather than dropping a column the way the flat table does. */
  .grid-rooms{min-width:520px}
  .grid-rooms .c-time{width:74px}
  .grid .c-time{width:auto}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img class="logo" src="assets/tabconf8-logo.png"
         alt="TABConf 8" width="720" height="410" decoding="async">
    <div class="titles">
      <h1>TABConf 8 Schedule</h1>
      <p class="sub">October 12-15, 2026 · Georgia Tech Exhibition Hall, Atlanta</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <input type="search" id="q" placeholder="Search sessions, speakers, topics…" autocomplete="off">
    <span class="seg" role="group" aria-label="View">
      <button id="v-details" aria-pressed="true">Details</button>
      <button id="v-calendar" aria-pressed="false">Calendar</button>
    </span>
  </div>
  <div id="out"><p class="empty">Loading the schedule…</p></div>
  <footer id="foot"></footer>
</div>

<script>
/* Renders data/schedule.json. All parsing, sorting and clash detection happens
   in the export script, so this file only decides what things look like.
   The export still calls all-day items track:"floor"; they are presented as
   "All day" because that is what they are to somebody reading a schedule. */
const S = { data:null, q:"", track:"all", view:"details" };
const el = (t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const isAllDay = s => s.track === 'floor';
const isSatellite = s => s.track === 'satellite';

const DAY_FMT = new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'});
const dayLabel = iso => iso ? DAY_FMT.format(new Date(iso+'T00:00:00Z')) : 'Not yet scheduled';
const dur = m => m==null ? '' : (m>=60 ? (m%60 ? (m/60|0)+'h '+(m%60)+'m' : (m/60|0)+'h') : m+'m');
/* Location is STORED now, not derived. Oct 12 and 13 run two rooms, the main
   stage and the hacker room, so hardcoding "Main stage" mislabelled half of
   the Builder Days. Falls back for any session exported before the Room field
   existed. */
const place = s => isSatellite(s) ? (s.room || 'Offsite') : (s.room || (isAllDay(s) ? 'Expo floor' : 'Main stage'));
const kindOf = s => s.labels.find(l=>/workshop|talk|panel|demo|socratic/i.test(l.name)) || null;

/* GitHub gives each label a hex. Use it, but pick the text colour from the
   background's luminance so a pale yellow and a deep navy are both readable.
   Same maths GitHub uses on its own label chips. */
function hexRGB(hex){
  const h=String(hex||'').replace('#','').trim();
  const s=h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  if(!/^[0-9a-f]{6}$/i.test(s)) return null;
  return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];
}
function luminance([r,g,b]){
  const f=v=>{v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
function labelChip(label){
  const span=el('span','tag',label.name);
  const rgb=hexRGB(label.color);
  if(rgb){
    span.style.background=label.color;
    span.style.color = luminance(rgb) > 0.45 ? '#14131a' : '#ffffff';
    span.style.borderColor='rgba(0,0,0,.18)';
  }else{
    span.style.borderColor='var(--line)';
    span.style.color='var(--muted)';
  }
  return span;
}
const SKIP_LABEL=/^accepted$|needs to be scheduled|^under consideration$|^details need to be confirmed$/i;

/* SPEAKERS ARRIVE AS OBJECTS {login, name, avatarUrl} and used to arrive as
   plain login strings. The export runs on its own cadence, so a deploy of this
   page can land hours before the next export rewrites the data. Normalising on
   read means neither shape breaks the page, and the whole rest of the file can
   assume objects. */
const speakerOf = x => typeof x === 'string' ? {login:x, name:'', avatarUrl:''}
                     : {login:(x&&x.login)||'', name:(x&&x.name)||'', avatarUrl:(x&&x.avatarUrl)||''};
/* The name when there is one, the handle when there is not. Never both: in a
   dense row "Keith Mukai (@kdmukai)" is twice the width for no extra meaning. */
const speakerLabel = p => p.name || ('@'+p.login);
const speakerText  = s => (s.speakers||[]).map(p=>p.name+' @'+p.login).join(' ');

function matches(s){
  const q=S.q.trim().toLowerCase();
  if(!q) return true;
  return (s.title+' '+s.summary+' '+speakerText(s)+' '+s.labels.map(l=>l.name).join(' '))
    .toLowerCase().includes(q);
}

function groupsOf(list){
  const g=new Map();
  list.forEach(s=>{const k=isAllDay(s)?'allday':(s.date||''); if(!g.has(k))g.set(k,[]); g.get(k).push(s);});
  const keys=[...g.keys()].sort((a,b)=>{
    if(a==='allday') return 1; if(b==='allday') return -1;
    return (a||'9999').localeCompare(b||'9999');
  });
  return keys.map(k=>[k,g.get(k)]);
}

function dayHead(key){
  const head=el('div','dayhead');
  const h=el('h2',null, key==='allday' ? 'All day' : dayLabel(key));
  if(key==='allday') h.appendChild(el('span','badge','Runs all event'));
  head.appendChild(h);
  return head;
}

function detailsNode(s){
  const row=el('div','session');
  const when=el('div','when');
  if(s.start){
    when.appendChild(el('span','s',s.start));
    when.appendChild(el('span','e','to '+s.end));
    if(s.durationMin) when.appendChild(el('span','d',dur(s.durationMin)));
  } else {
    when.appendChild(el('span','e', isAllDay(s) ? 'All day' : 'TBA'));
  }
  row.appendChild(when);

  const body=el('div');
  const h=el('h3','title');
  const a=el('a',null,s.title); a.href=s.url; a.target='_blank'; a.rel='noopener';
  h.appendChild(a); body.appendChild(h);
  if(s.summary) body.appendChild(el('p','summary',s.summary));

  /* SPEAKERS GET THEIR OWN LINE ABOVE THE LABELS. They used to be one more chip
     in the tag row, which put a person between 'Workshop' and '#41' and read as
     metadata about the session rather than as who is giving it. Avatar, name,
     and a link to the profile, because an attendee deciding what to attend is
     choosing a person as often as a topic. */
  if(s.speakers.length){
    const who=el('div','speakers');
    s.speakers.forEach(p=>{
      const a=el('a','speaker');
      a.href='https://github.com/'+encodeURIComponent(p.login);
      a.target='_blank'; a.rel='noopener';
      a.title='@'+p.login;
      if(p.avatarUrl){
        const img=document.createElement('img');
        // GitHub avatars come back as .../u/123?v=4, so the size goes on with
        // an &. Checked rather than assumed, because a URL with no query would
        // otherwise silently request a 404.
        img.className='avatar';
        img.src=p.avatarUrl+(p.avatarUrl.indexOf('?')===-1?'?':'&')+'s=48';
        img.alt='';
        img.loading='lazy'; img.width=24; img.height=24;
        a.appendChild(img);
      }
      a.appendChild(el('span',null,speakerLabel(p)));
      who.appendChild(a);
    });
    body.appendChild(who);
  }

  const tags=el('div','tags');
  s.labels.filter(l=>!SKIP_LABEL.test(l.name)).forEach(l=>tags.appendChild(labelChip(l)));
  tags.appendChild(el('span','num','#'+s.number));
  body.appendChild(tags);
  row.appendChild(body);
  return row;
}

/* A day with more than one room draws a real grid: one column per room, one row
   per distinct start time. A day with a single room keeps the flat table,
   because a one column grid is just a table with a wasted header. Oct 12 and 13
   run the main stage and the hacker room; Oct 14 and 15 add BitLab Village
   alongside the main stage.

   Rows are every start and end boundary in the day and each card spans the
   rows it covers (Michael, 2026-10-06), so session length is visible at a
   glance. See roomGrid.

   AN UNLISTED ROOM STILL RENDERS, it just sorts to the far right, so this list
   is reading order and not a list of which rooms exist. */
const ROOM_ORDER = ['Main stage', 'Hacker room', 'BitLab Village', 'Expo floor'];
const roomRank = r => { const i = ROOM_ORDER.indexOf(r); return i === -1 ? 99 : i; };

function sessionCell(s){
  const wrap = el('div','cell');
  const a = el('a',null,s.title); a.href=s.url; a.target='_blank'; a.rel='noopener';
  const line = el('div','cell-title'); line.appendChild(a);
  const k = kindOf(s); if(k) line.appendChild(labelChip(k));
  wrap.appendChild(line);
  if (s.start) wrap.appendChild(el('div','cell-meta', s.start + ' - ' + s.end));
  // Tiny speaker avatars with names, linked to their GitHub profiles.
  if (s.speakers.length){
    const who = el('div','cell-who');
    s.speakers.forEach(p=>{
      const sp = el('a','cell-sp'); sp.href='https://github.com/'+p.login; sp.target='_blank'; sp.rel='noopener';
      if (p.avatarUrl){
        const img = document.createElement('img'); img.alt=''; img.loading='lazy';
        img.src = p.avatarUrl+(p.avatarUrl.indexOf('?')===-1?'?':'&')+'s=36';
        sp.appendChild(img);
      }
      sp.appendChild(el('span',null,speakerLabel(p)));
      who.appendChild(sp);
    });
    wrap.appendChild(who);
  }
  return wrap;
}

function flatTable(items){
  const t=el('table','grid');
  const thead=el('thead'), hr=el('tr');
  ['Time','Session','Speaker','Location'].forEach((h,i)=>{
    const th=el('th',null,h); th.className=['c-time','c-title','c-who','c-loc'][i]; hr.appendChild(th);
  });
  thead.appendChild(hr); t.appendChild(thead);
  const tb=el('tbody');
  items.forEach(s=>{
    const tr=el('tr');
    tr.appendChild(el('td','c-time', s.start ? s.start+' - '+s.end : 'All day'));
    const td=el('td','c-title');
    const a=el('a',null,s.title); a.href=s.url; a.target='_blank'; a.rel='noopener';
    td.appendChild(a);
    const k=kindOf(s); if(k) td.appendChild(labelChip(k));
    tr.appendChild(td);
    tr.appendChild(el('td','c-who', s.speakers.map(speakerLabel).join(', ')));
    tr.appendChild(el('td','c-loc', place(s)));
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}

function roomGrid(timed, rooms){
  const t=el('table','grid grid-rooms');
  const thead=el('thead'), hr=el('tr');
  const th0=el('th',null,'Time'); th0.className='c-time'; hr.appendChild(th0);
  rooms.forEach(r=>{ const th=el('th',null,r); th.className='c-room'; hr.appendChild(th); });
  thead.appendChild(hr); t.appendChild(thead);

  /* CARDS SPAN THEIR LENGTH. Rows are every start and end boundary in the day,
     each row is drawn at a height proportional to its minutes, and a session's
     cell spans every row it covers, so a 2 hour workshop is visibly four times
     a 30 minute talk. A session starting inside another one in the same room
     (a short moment inside the early closing ceremony) joins that card rather than
     breaking the grid. */
  const endOf = s => (s.endMin!=null && s.endMin>s.startMin) ? s.endMin : s.startMin+15;
  const bounds=[...new Set(timed.flatMap(s=>[s.startMin, endOf(s)]))].sort((a,b)=>a-b);
  const fmt = m => { const h=Math.floor(m/60), mm=m%60; return ((h+11)%12+1)+':'+String(mm).padStart(2,'0')+(h<12?' AM':' PM'); };
  const startsAt = new Set(timed.map(s=>s.startMin));
  const covered = {};          // room -> row index the current span runs until
  const holder = {};           // room -> td of the current span
  const tb=el('tbody');
  for(let i=0;i<bounds.length-1;i++){
    const a=bounds[i], b=bounds[i+1];
    const tr=el('tr');
    tr.style.height=Math.max(26, Math.round((b-a)*1.6))+'px';
    const tc=el('td','c-time', startsAt.has(a) ? fmt(a) : '');
    tr.appendChild(tc);
    rooms.forEach(r=>{
      const here = timed.filter(s=>s.startMin===a && place(s)===r).sort((x,y)=>endOf(y)-endOf(x));
      if (covered[r]!==undefined && i<covered[r]){
        here.forEach(s=>holder[r].appendChild(sessionCell(s)));
        return;
      }
      const td=el('td','c-room');
      if (here.length){
        const end=endOf(here[0]);
        const last=bounds.indexOf(end);
        td.rowSpan=Math.max(1,last-i);
        td.className='c-room span';
        // Tint the card toward its type label's colour (Talk or Demo, Panel,
        // Workshop...). No type label keeps the default card colour.
        const k=kindOf(here[0]); const rgb=k && hexRGB(k.color);
        if(rgb){
          const c='rgba('+rgb.join(',')+',';
          td.style.background='linear-gradient('+c+'.16),'+c+'.16)),var(--accent-soft)';
          td.style.borderLeftColor=k.color.startsWith('#')?k.color:'#'+k.color;
        }
        here.forEach(s=>td.appendChild(sessionCell(s)));
        covered[r]=last; holder[r]=td;
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  return t;
}

/* Satellite events: other people's events, offsite, usually in the evening.
   They get their own block under each day rather than a row in the grid,
   because they share nothing with the main programme except the date. */
function satelliteBlock(sats){
  const wrap = el('div','sats');
  wrap.appendChild(el('div','sats-head','Satellite events'));
  sats.sort((a,b)=>(a.startMin===null?1e9:a.startMin)-(b.startMin===null?1e9:b.startMin)).forEach(s=>{
    const row = el('div','sat');
    const t = el('div','sat-when', s.start ? s.start : 'Time TBC');
    const b = el('div','sat-body');
    const a = el('a',null,s.title); a.href=s.url; a.target='_blank'; a.rel='noopener';
    b.appendChild(a);
    if (s.room && s.room !== 'Offsite') b.appendChild(el('span','sat-place', ' at ' + s.room));
    row.appendChild(t); row.appendChild(b);
    wrap.appendChild(row);
  });
  wrap.appendChild(el('div','sats-note','Run by other organisers. Check the link for tickets and RSVP.'));
  return wrap;
}

function calendarTable(items){
  const sats   = items.filter(isSatellite);
  const rest   = items.filter(s=>!isSatellite(s));
  const allDay = rest.filter(s=>isAllDay(s) || s.startMin===null);
  const timed  = rest.filter(s=>!(isAllDay(s) || s.startMin===null));
  const rooms  = [...new Set(timed.map(place))].sort((a,b)=>roomRank(a)-roomRank(b));

  // One room, or nothing timed: the flat table says it better.
  if (rooms.length < 2){
    const only = el('div');
    only.appendChild(flatTable(rest));
    if (sats.length) only.appendChild(satelliteBlock(sats));
    return only;
  }

  const box = el('div','gridwrap');
  box.appendChild(roomGrid(timed, rooms));
  if (allDay.length){
    const t2=el('table','grid');
    const th=el('thead'), r=el('tr');
    const a=el('th',null,'All day'); a.className='c-time'; r.appendChild(a);
    const b=el('th',null,'Session'); b.className='c-title'; r.appendChild(b);
    const c=el('th',null,'Location'); c.className='c-loc'; r.appendChild(c);
    th.appendChild(r); t2.appendChild(th);
    const tb=el('tbody');
    allDay.forEach(s=>{
      const tr=el('tr');
      tr.appendChild(el('td','c-time','All day'));
      const td=el('td','c-title');
      const link=el('a',null,s.title); link.href=s.url; link.target='_blank'; link.rel='noopener';
      td.appendChild(link);
      const k=kindOf(s); if(k) td.appendChild(labelChip(k));
      tr.appendChild(td);
      tr.appendChild(el('td','c-loc', place(s)));
      tb.appendChild(tr);
    });
    t2.appendChild(tb);
    box.appendChild(t2);
  }
  if (sats.length) box.appendChild(satelliteBlock(sats));
  return box;
}

function render(){
  const out=document.getElementById('out');
  out.innerHTML='';
  const list=S.data.sessions.filter(matches);
  if(!list.length){ out.appendChild(el('p','empty','No sessions match that.')); return; }

  if(S.data.clashes && S.data.clashes.length){
    const n=el('div','note');
    n.innerHTML='<strong>Scheduling conflict.</strong> '+S.data.clashes.length+
      ' session(s) overlap in the same room: '+S.data.clashes.join('; ');
    out.appendChild(n);
  }

  for(const [key,items] of groupsOf(list)){
    const sec=el('section','day');
    sec.appendChild(dayHead(key));
    if(S.view==='calendar') sec.appendChild(calendarTable(items));
    else items.forEach(s=>sec.appendChild(detailsNode(s)));
    out.appendChild(sec);
  }
}

function bind(){
  document.getElementById('q').addEventListener('input',e=>{S.q=e.target.value;render();});

  const views={details:'v-details',calendar:'v-calendar'};
  Object.entries(views).forEach(([v,id])=>{
    document.getElementById(id).addEventListener('click',()=>{
      S.view=v;
      Object.entries(views).forEach(([vv,ii])=>
        document.getElementById(ii).setAttribute('aria-pressed',String(vv===v)));
      try{localStorage.setItem('tabconf8-view',v);}catch(e){}
      render();
    });
  });

}

fetch('data/schedule.json?v='+Date.now())
  .then(r=>r.json())
  .then(d=>{
    S.data = Array.isArray(d) ? {clashes:[],sessions:d} : d;
    S.data.sessions = (S.data.sessions||[]).map(s=>{
      const o = Object.assign(
        {number:0,title:'',url:'#',date:'',start:'',end:'',startMin:null,endMin:null,
         durationMin:null,track:'stage',room:'',speakers:[],labels:[],summary:''},s);
      // One normalisation point for both speaker shapes, old and new. Do this
      // here and nothing downstream has to ask which it got.
      o.speakers = (o.speakers||[]).map(speakerOf).filter(p=>p.login);
      return o;
    });
    try{
      const v=localStorage.getItem('tabconf8-view');
      if(v==='calendar'){S.view='calendar';
        document.getElementById('v-calendar').setAttribute('aria-pressed','true');
        document.getElementById('v-details').setAttribute('aria-pressed','false');}
    }catch(e){}
    bind(); render();
    const g=S.data.generatedAt ? new Date(S.data.generatedAt).toLocaleString() : 'unknown';
    document.getElementById('foot').textContent='Updated '+g+'. Sessions are curated from public submissions on GitHub.';
  })
  .catch(()=>{
    document.getElementById('out').innerHTML=
      '<p class="empty">The schedule is not published yet. Check back soon.</p>';
  });
</script>
</body>
